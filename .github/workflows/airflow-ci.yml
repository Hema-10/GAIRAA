name: Airflow Project CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "Ubuntu basic Airflow Project/requirements.txt"

      - name: Validate Python syntax
        run: |
          python -m compileall -q "Ubuntu basic Airflow Project/dags"

      - name: Run ETL tests
        run: |
          python -m unittest discover -s "Ubuntu basic Airflow Project/tests" -v
